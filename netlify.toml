[build]
  command = "npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run start"
  port = 3000
  publish = "build"

[build.environment]
  NODE_ENV = "production"
  REACT_APP_API_BASE_URL = "https://betterment.network"
  # Add other environment variables as needed
